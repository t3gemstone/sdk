[gemstone-sdk]
image=gemstone-sdk
init=true
nvidia=false
pull=false
root=false
start_now=true
hostname="gemstone"
home="$PWD/.distrobox"
volume="$PWD:/home/workdir"
additional_packages="systemd"
additional_flags="--device /dev/kvm --security-opt label=disable --security-opt seccomp=$PWD/.meta/seccomp-no-openat2.json"
init_hooks="mount -i -o remount,exec,dev /home/workdir"
init_hooks="mount -i -o remount,exec,dev /run"
