# The host only needs an address to reach the board at 192.168.7.2. Do
# not offer it a gateway or DNS server: hosts prefer a wired link, so it
# would send all its traffic through the board, and Windows even drops
# its Wi-Fi when it sees internet access on the USB link.
dhcp-option=tag:usb0,option:router
dhcp-option=tag:usb0,option:dns-server
