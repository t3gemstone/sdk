# Sourced by ~/kiosk.environment.
#
# This board has a PowerVR GPU, and the only way to reach it is EGL on DRM/KMS:
# TI's Mesa is built without GLX, so an Xorg session renders on the CPU with
# llvmpipe no matter what. eglfs skips the display server and hands the panel
# straight to the Qt application.
#
# One caveat, measured on this board. Under eglfs:
#
#   Qt Quick / QML .......... works, GPU accelerated  (PowerVR B-Series BXS-4-64)
#   native EGL/GL ........... works, GPU accelerated  (kmscube)
#   QtWidgets ............... BLACK SCREEN
#
# QtWidgets renders into a raster backingstore that Qt then uploads as a texture
# and composites with GL. That upload produces nothing on the PowerVR driver --
# Qt reports no error, sets the mode correctly and keeps flipping buffers, the
# panel just stays black. The same application under llvmpipe draws fine, so it
# is the driver, not Qt's configuration.
#
# The kiosk example application is Qt Quick, so it is unaffected. Switch this to
# x11 if your application uses QtWidgets, or is not a Qt application at all.
KIOSK_BACKEND=eglfs
