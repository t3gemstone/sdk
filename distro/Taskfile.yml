version: '3'

includes:
  yocto:
    taskfile: ../yocto
    internal: true

tasks:

  permissions:
    internal: true
    cmds:
      - sudo mkdir -p {{ .IMG_DEPLOY_DIR }}
      - sudo chown $USER:$USER {{ .IMG_DEPLOY_DIR }}
      - chmod +x {{ .WORKDIR }}/distro/scripts/*/*.sh

  build:
    cmds:
      - task: permissions
      - task: yocto:local-apt-server
      # WSL mounts /run as nodev. debootstrap must be able to create device
      # nodes in its target, so keep all debos working directories on the
      # native ext4 workspace instead of /run.
      - |
        if command -v update-binfmts >/dev/null 2>&1 && [ -e /proc/sys/fs/binfmt_misc/register ]; then
          sudo update-binfmts --enable qemu-aarch64
        fi
        # debos' chroot backend bind-mounts /dev/disk. WSL does not create
        # that conventional directory when no block device is exposed.
        if grep -qi microsoft /proc/sys/kernel/osrelease; then
          sudo mkdir -p /dev/disk
          # WSL does not start udev because PID 1 is not systemd. debos waits
          # for udev after partitioning and otherwise stalls for minutes.
          if [ ! -S /run/udev/control ]; then
            sudo /lib/systemd/systemd-udevd --daemon
          fi
        fi
      - sudo rm -rf {{ .IMG_DEPLOY_DIR }}/root
      - sudo mkdir -p {{ .IMG_DEPLOY_DIR }}/work {{ .IMG_DEPLOY_DIR }}/root {{ .IMG_DEPLOY_DIR }}/scratch
      - cd {{ .IMG_DEPLOY_DIR }}/work &&
          sudo debos
            --disable-fakemachine
            --debug-shell
            --artifactdir={{ .IMG_DEPLOY_DIR }}
            --scratchdir={{ .IMG_DEPLOY_DIR }}/scratch
            --rootdir={{ .IMG_DEPLOY_DIR }}/root
            --template-var="workdir:{{ .WORKDIR }}"
            --template-var="machine:{{ .MACHINE }}"
            --template-var="base:{{ .DISTRO_BASE }}"
            --template-var="type:{{ .DISTRO_TYPE }}"
            --template-var="suite:{{ .DISTRO_SUITE }}"
            --template-var="release:{{ .IMG_RELEASE }}"
            --template-var="image:{{ .IMG_FILE_NAME }}"
            --template-var="imagepath:{{ .IMG_FILE_PATH }}"
            --template-var="imagesize:{{ .IMG_SIZE }}"
            --template-var="arch:{{ .DISTRO_ARCH }}"
            --template-var="encrypt:{{ .ENCRYPT }}"
            --template-var="mobian:{{ .MOBIAN }}"
            --template-var="selinux:{{ .SELINUX }}"
            {{ .WORKDIR }}/distro/distro.yaml 2>&1 | tee -a {{ .IMG_DEPLOY_DIR }}/log.txt
      - sudo chown $USER:$USER {{ .IMG_FILE_PATH }}*
      - |
        if [ "{{ .ENCRYPT }}" = "true" ]; then
          task utils:encrypt-image IMG_FILE_PATH={{ .IMG_FILE_PATH }}
        fi
    preconditions:
      # t3-gem-o1 images carry the PowerVR userspace; fail here rather than an
      # hour into debos.
      - sh: 'test "{{ .MACHINE }}" != "t3-gem-o1" || test -f {{ .WORKDIR }}/build/graphics/{{ .MACHINE }}/opt/ti-gpu/lib/dri/pvr_dri.so'
        msg: "GPU userspace missing. Run <task graphics:build MACHINE={{ .MACHINE }}>"
    requires:
      vars:
        - name: MACHINE
          enum: [ beagley-ai, intel-corei7-64, t3-gem-o1, qemuarm64 ]
        - name: DISTRO_BASE
          enum: [ ubuntu, debian, pardus ]
        - name: DISTRO_TYPE
          enum: [ minimal, kiosk, desktop, wayland-desktop, tablet ]
        - name: DISTRO_ARCH
          enum: [ arm64, amd64 ]
        - name: DISTRO_SUITE
          enum:
            - jammy     # Ubuntu 22
            - noble     # Ubuntu 24
            - bullseye  # Debian 11
            - bookworm  # Debian 12
            - yirmiuc   # Pardus 23
            - yirmibes  # Pardus 25

  build:all:ubuntu:
    cmds:
      - for:
          matrix:
            SUITE: [ "jammy", "noble" ]
            TYPE: [ "minimal", "kiosk", "desktop" ]
        cmd: |
          unset MACHINE
          task distro:build MACHINE={{.MACHINE}} DISTRO_BASE=ubuntu DISTRO_TYPE={{.ITEM.TYPE}} DISTRO_SUITE={{.ITEM.SUITE}}

  build:all:debian:
    cmds:
      - for:
          matrix:
            SUITE: [ "bullseye", "bookworm" ]
            TYPE: [ "minimal", "kiosk", "desktop" ]
        cmd: |
          unset MACHINE
          task distro:build MACHINE={{.MACHINE}} DISTRO_BASE=debian DISTRO_TYPE={{.ITEM.TYPE}} DISTRO_SUITE={{.ITEM.SUITE}}

  build:all:pardus:
    cmds:
      - for:
          matrix:
            SUITE: [ "yirmiuc", "yirmibes" ]
            TYPE: [ "minimal", "kiosk", "desktop" ]
        cmd: |
          unset MACHINE
          task distro:build MACHINE={{.MACHINE}} DISTRO_BASE=pardus DISTRO_TYPE={{.ITEM.TYPE}} DISTRO_SUITE={{.ITEM.SUITE}}

  build:all:
    desc: Build every machine and distro
    cmds:
      - for:
          matrix:
            DISTRO: [ "ubuntu", "debian", "pardus" ]
            MACHINE: [ "beagley-ai", "intel-corei7-64", "t3-gem-o1", "qemuarm64" ]
        cmd: 'task distro:build:all:{{.ITEM.DISTRO}} MACHINE={{.ITEM.MACHINE}}'

  build:all:t3-gem-o1:
    desc: Build distro for t3-gem-o1 machine
    cmds:
      - for:
          matrix:
            DISTRO: [ "ubuntu", "debian", "pardus" ]
        cmd: 'task distro:build:all:{{.ITEM.DISTRO}} MACHINE=t3-gem-o1'

  build:wayland:t3-gem-o1:
    desc: Build the PowerVR accelerated KDE Plasma Wayland image for t3-gem-o1
    cmds:
      # Invoke the included task through the CLI so the image-name variables
      # are evaluated with wayland-desktop rather than the top-level minimal
      # defaults.
      - task distro:build
          MACHINE=t3-gem-o1
          DISTRO_BASE=ubuntu
          DISTRO_TYPE=wayland-desktop
          DISTRO_SUITE=jammy
          IMG_SIZE='{{ .IMG_SIZE | default "14G" }}'

  verify:wayland:
    desc: Validate the T3 Plasma Wayland image integration without building an image
    cmds:
      - '{{ .WORKDIR }}/distro/scripts/wayland-desktop/verify-integration.sh {{ .WORKDIR }}'
