name: Create Distro Image with Debos

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

env:
    RELEASE: v2026.1
    WORKDIR: /home/workdir
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.machine }}/${{ matrix.base }}/${{ matrix.suite }}/${{ matrix.type }}
    runs-on: ubuntu-22.04
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'run-workflow')
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        machine: [beagley-ai, t3-gem-o1, intel-corei7-64]
        base:    [ubuntu, debian, pardus]
        suite:   [jammy, bookworm, yirmiuc, yirmibes, noble]
        type:    [minimal, kiosk, desktop]
        exclude:
          - base: ubuntu
            suite: yirmiuc
          - base: ubuntu
            suite: yirmibes
          - base: ubuntu
            suite: bookworm
          - base: pardus
            suite: jammy
          - base: pardus
            suite: bookworm
          - base: pardus
            suite: noble
          - base: debian
            suite: yirmiuc
          - base: debian
            suite: yirmibes
          - base: debian
            suite: jammy
          - base: debian
            suite: noble
        include:
          - machine: beagley-ai
            arch: arm64
          - machine: t3-gem-o1
            arch: arm64
          - machine: intel-corei7-64
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch repos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.repos"
          python -m pip install vcstool
          vcs import --skip-existing "$GITHUB_WORKSPACE/.repos" < ${{ github.workspace }}/repos.yml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
            # qemu-v8.1.x through at least v9.0.0 (and reportedly v9.2.x/v10.x too) segfault
            # during arm64 debootstrap around zlib1g/libc-bin/ldconfig:
            # https://gitlab.com/qemu-project/qemu/-/issues/2377
            # https://github.com/tonistiigi/binfmt/issues/240
            # v7.0.0-28 predates the regression and is a known-good fallback.
            image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Disable ASLR (qemu-v7.0.0-28 is built with --disable-pie)
        # binfmt builds before qemu-v8.1 use --disable-pie, which segfaults under
        # emulation when the host has ASLR enabled (the GitHub runner default):
        # https://github.com/tonistiigi/binfmt/issues/215
        run: sudo sysctl -w kernel.randomize_va_space=0

      - name: Run debos
        env:
          IMG_FILE_NAME: gemstone-${{ matrix.type }}-${{ env.RELEASE }}-${{ matrix.base }}-${{ matrix.suite }}-${{ matrix.machine }}.img
          IMG_SIZE: ${{ matrix.type == 'minimal' && '1024M' || matrix.type == 'kiosk' && '4096M' || '16384M' }}
        run: |
          docker run --rm \
            --privileged \
            --cgroupns host \
            --net=host \
            --security-opt seccomp=unconfined \
            --volume /dev:/dev \
            --volume /run/udev:/run/udev:ro \
            --volume debos-scratch:/scratch \
            --volume "$GITHUB_WORKSPACE:${{ env.WORKDIR }}" \
            --volume "$GITHUB_WORKSPACE/.repos/src:${{ env.WORKDIR }}/src" \
            --workdir "${{ env.WORKDIR }}" \
            t3gemstone/debos:1.1.3.7 \
            --scratchdir=/scratch \
            --disable-fakemachine \
            --artifactdir=${{ env.WORKDIR }} \
            --template-var="workdir:${{ env.WORKDIR }}" \
            --template-var="machine:${{ matrix.machine }}" \
            --template-var="base:${{ matrix.base }}" \
            --template-var="type:${{ matrix.type }}" \
            --template-var="suite:${{ matrix.suite }}" \
            --template-var="release:${{ env.RELEASE }}" \
            --template-var="image:${{ env.IMG_FILE_NAME }}" \
            --template-var="imagepath:${{ env.WORKDIR }}/${{ env.IMG_FILE_NAME }}" \
            --template-var="imagesize:${{ env.IMG_SIZE }}" \
            --template-var="arch:${{ matrix.arch }}" \
            --template-var="ci:true" \
            --verbose \
            ${{ env.WORKDIR }}/distro/distro.yaml

      - name: Upload Image
        uses: actions/upload-artifact@v4
        env:
          IMG_FILE_NAME: gemstone-${{ matrix.type }}-${{ env.RELEASE }}-${{ matrix.base }}-${{ matrix.suite }}-${{ matrix.machine }}
        with:
          name: ${{ env.IMG_FILE_NAME }}
          path: ${{ github.workspace }}/${{ env.IMG_FILE_NAME }}.img
